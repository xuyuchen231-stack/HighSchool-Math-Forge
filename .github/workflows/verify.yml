name: Validate Math Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate curriculum and required files
        run: python scripts/validate.py
      - name: Render reproducible mathematical figures
        run: python scripts/plot_examples.py --out examples/figures
      - name: Upload vector and raster figures
        uses: actions/upload-artifact@v4
        with:
          name: mathematics-figures
          path: examples/figures/
